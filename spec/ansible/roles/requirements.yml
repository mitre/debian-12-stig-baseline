roles:
  # CIS benchmark remediation for Debian 12 — used by the hardened LXD suite
  # because no DISA STIG remediation playbook exists for Debian. See
  # ansible-role-debian-hardened.yml. Pinned to 2.0.5 (newest release); its
  # min_ansible_version 2.16.1 is satisfied by the bookworm kitchen venv's
  # ansible-core 2.18 pin.
  - name: DEBIAN12-CIS
    src: https://github.com/ansible-lockdown/DEBIAN12-CIS
    version: 2.0.5

collections:
  - name: community.general
    source: https://galaxy.ansible.com
  - name: community.crypto
    source: https://galaxy.ansible.com
  - name: ansible.posix
    source: https://galaxy.ansible.com
