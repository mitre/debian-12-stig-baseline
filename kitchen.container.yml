---
# see: https://kitchen.ci/docs/drivers/dokken/
#
# Vanilla only: public Debian 12 (bookworm) image from Docker Hub. Debian has
# no Iron Bank-style hardened base image, so the hardened container suite was
# dropped (card debian-12-stig-baseline-1fx.4); hardened scanning lives in the
# LXD VM suite, which converges the DEBIAN12-CIS role first.

provisioner:
  name: dummy

driver:
  name: dokken
  pull_platform_image: false

transport:
  name: dokken

platforms:
  - name: debian-12

suites:
  - name: vanilla
    driver:
      image: <%= ENV['VANILLA_CONTAINER_IMAGE'] || "docker.io/library/debian:12" %>
    verifier:
      input_files:
        - container.vanilla.inputs.yml
